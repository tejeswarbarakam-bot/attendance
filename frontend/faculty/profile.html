<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Profile - Attendance ERP</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">👨‍🏫</div>
        <div class="logo-text">Faculty Portal</div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><span>🏠</span> Dashboard</a></li>
        <li><a href="mark-attendance.html"><span>📝</span> Mark Attendance</a></li>
        <li><a href="history.html"><span>📜</span> History</a></li>
        <li><a href="reports.html"><span>📊</span> Reports</a></li>
        <li><a href="profile.html" class="active"><span>👤</span> Profile</a></li>
        <li style="margin-top: 2rem;"><a href="#" onclick="Auth.logout()"><span>🚪</span> Logout</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="avatar" id="user-avatar">F</div>
          <div class="user-info">
            <div class="name" id="user-display-name">Faculty Name</div>
            <div class="role" id="user-display-role">Faculty</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <button class="hamburger-btn" id="hamburger-btn">☰</button>
        <div class="page-title">
          <h1>Faculty Profile</h1>
          <p>Personal & academic employment details</p>
        </div>
        <div class="top-navbar-actions">
          <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Logout</button>
        </div>
      </header>

      <main class="content-container">
        <div class="table-card" style="max-width: 700px; margin: 0 auto; padding: 2rem;">
          <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">Faculty Details</h3>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">FULL NAME</div>
              <div id="prof-name" style="font-weight: 700; font-size: 1.1rem;">-</div>
            </div>

            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">FACULTY ID</div>
              <div id="prof-id" style="font-weight: 700; font-size: 1.1rem;">-</div>
            </div>

            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">EMAIL ADDRESS</div>
              <div id="prof-email" style="font-weight: 600;">-</div>
            </div>

            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">PHONE NUMBER</div>
              <div id="prof-phone" style="font-weight: 600;">-</div>
            </div>

            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">DEPARTMENT</div>
              <div id="prof-dept" style="font-weight: 600;">-</div>
            </div>

            <div>
              <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;">DESIGNATION</div>
              <div id="prof-desig" style="font-weight: 600;">-</div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/faculty.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FacultyPortal.initProfile();
    });
  </script>
</body>
</html>
