<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty History - Attendance ERP</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">👨‍🏫</div>
        <div class="logo-text">Faculty Portal</div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><span>🏠</span> Dashboard</a></li>
        <li><a href="mark-attendance.html"><span>📝</span> Mark Attendance</a></li>
        <li><a href="history.html" class="active"><span>📜</span> History</a></li>
        <li><a href="reports.html"><span>📊</span> Reports</a></li>
        <li><a href="profile.html"><span>👤</span> Profile</a></li>
        <li style="margin-top: 2rem;"><a href="#" onclick="Auth.logout()"><span>🚪</span> Logout</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="avatar" id="user-avatar">F</div>
          <div class="user-info">
            <div class="name" id="user-display-name">Faculty Name</div>
            <div class="role" id="user-display-role">Faculty</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <button class="hamburger-btn" id="hamburger-btn">☰</button>
        <div class="page-title">
          <h1>Submitted Attendance History</h1>
          <p>Review & edit previously submitted class logs</p>
        </div>
        <div class="top-navbar-actions">
          <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Logout</button>
        </div>
      </header>

      <main class="content-container">
        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <label for="filter-date">Date</label>
            <input type="date" id="filter-date" class="form-control" />
          </div>

          <div class="filter-group">
            <label for="filter-status">Status</label>
            <select id="filter-status" class="form-control">
              <option value="">All Statuses</option>
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
            </select>
          </div>

          <div style="margin-top: auto;">
            <button id="filter-btn" class="btn btn-primary btn-sm" style="height: 42px;">Apply Filter</button>
          </div>
        </div>

        <div class="table-card">
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Student</th>
                  <th>Subject</th>
                  <th>Period</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="faculty-history-tbody">
                <tr><td colspan="6" style="text-align:center;">Loading logs...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/faculty.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FacultyPortal.initFacultyHistory();
    });
  </script>
</body>
</html>
