<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Student Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">🎓</div>
        <div class="logo-text">Student Portal</div>
      </div>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html"><span>🏠</span> Dashboard</a></li>
        <li><a href="attendance.html"><span>📚</span> My Attendance</a></li>
        <li><a href="history.html"><span>📜</span> History</a></li>
        <li><a href="notifications.html" class="active"><span>🔔</span> Notifications</a></li>
        <li><a href="profile.html"><span>👤</span> Profile</a></li>
        <li style="margin-top: 2rem;"><a href="#" onclick="Auth.logout()"><span>🚪</span> Logout</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="avatar" id="user-avatar">S</div>
          <div class="user-info">
            <div class="name" id="user-display-name">Student Name</div>
            <div class="role" id="user-display-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <button class="hamburger-btn" id="hamburger-btn">☰</button>
        <div class="page-title">
          <h1>Notifications</h1>
          <p>Important administrative and shortage alerts</p>
        </div>
        <div class="top-navbar-actions">
          <button class="btn btn-outline btn-sm" onclick="Auth.logout()">Logout</button>
        </div>
      </header>

      <main class="content-container">
        <div id="notifications-list" style="max-width: 800px; margin: 0 auto;">
          <p style="text-align:center;">Loading notifications...</p>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      StudentPortal.initNotifications();
    });
  </script>
</body>
</html>
